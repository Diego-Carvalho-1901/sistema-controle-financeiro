# Configuração do Alembic (migrações do banco).
# A URL do banco NÃO fica aqui: o migracoes/env.py lê a variável de ambiente
# FINANCEIRO_DB_URL (ou usa o SQLite local financeiro.db).
#
# Comandos mais usados:
#   alembic upgrade head                          aplica todas as migrações
#   alembic revision --autogenerate -m "mensagem"  cria uma migração nova
#   alembic check                                 confere se falta migração

[alembic]
script_location = %(here)s/migracoes
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
